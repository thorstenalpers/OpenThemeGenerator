<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="OpenThemeGenerator">
	<defs>
		<linearGradient id="painted" x1="32" y1="0" x2="54" y2="64" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#6366f1" />
			<stop offset="1" stop-color="#a855f7" />
		</linearGradient>
		<clipPath id="bare"><rect x="0" y="0" width="32" height="64" /></clipPath>
		<clipPath id="themed"><rect x="32" y="0" width="32" height="64" /></clipPath>

		<!-- The edge of the silhouette, not of the shapes it is made of: outlining the body and the
		     head separately would draw both in full, including the halves buried inside the other. -->
		<mask id="body-edge">
			<ellipse cx="32" cy="38.7" rx="15.7" ry="17.6" fill="#fff" />
			<ellipse cx="32" cy="21.4" rx="11.4" ry="11.4" fill="#fff" />
			<ellipse cx="32" cy="38.7" rx="14" ry="15.9" fill="#000" />
			<ellipse cx="32" cy="21.4" rx="9.7" ry="9.7" fill="#000" />
		</mask>
		<mask id="belly-edge">
			<ellipse cx="32" cy="41.3" rx="10.4" ry="13.6" fill="#fff" />
			<ellipse cx="32" cy="41.3" rx="9.1" ry="12.3" fill="#000" />
		</mask>
	</defs>

	<rect width="64" height="64" rx="14" fill="#101014" />

	<!-- Themed: the half a theme has already reached. -->
	<g clip-path="url(#themed)">
		<ellipse cx="47.8" cy="40.3" rx="3.3" ry="9.6" transform="rotate(18 47.8 40.3)" fill="#a855f7" />
		<ellipse cx="32" cy="38.7" rx="15.7" ry="17.6" fill="url(#painted)" />
		<ellipse cx="32" cy="21.4" rx="11.4" ry="11.4" fill="url(#painted)" />
		<ellipse cx="38.5" cy="56.2" rx="5" ry="2.2" transform="rotate(8 38.5 56.2)" fill="#f59e0b" />
		<ellipse cx="32" cy="41.3" rx="10.4" ry="13.6" fill="#f5f6fa" />
		<ellipse cx="32" cy="22.4" rx="8.2" ry="7.6" fill="#f5f6fa" />
		<path d="M29.3 23.8h5.4L32 27.2Z" fill="#f59e0b" />
		<circle cx="35.1" cy="20.2" r="1.7" fill="#121218" />
	</g>

	<!-- Bare: the same bird before it. -->
	<g clip-path="url(#bare)" fill="#f5f6fa">
		<rect width="64" height="64" mask="url(#body-edge)" />
		<rect width="64" height="64" mask="url(#belly-edge)" />
		<ellipse cx="16.2" cy="40.3" rx="3.3" ry="9.6" transform="rotate(-18 16.2 40.3)" />
		<ellipse cx="25.5" cy="56.2" rx="5" ry="2.2" transform="rotate(-8 25.5 56.2)" />
		<circle cx="28.9" cy="20.2" r="1.7" />
	</g>
</svg>
