<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="OpenThemeGenerator">
	<defs>
		<linearGradient id="painted" x1="32" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#6366f1" />
			<stop offset="1" stop-color="#a855f7" />
		</linearGradient>
		<clipPath id="bare"><rect x="0" y="0" width="32" height="64" /></clipPath>
		<clipPath id="themed"><rect x="32" y="0" width="32" height="64" /></clipPath>

		<!-- The edge of the silhouette, not of the shapes it is made of: outlining the body and the
		     head separately would draw both in full, including the halves buried inside the other. -->
		<mask id="body-edge">
			<ellipse cx="32" cy="37.25" rx="18.27" ry="20.5" fill="#fff" />
			<ellipse cx="32" cy="17.12" rx="13.27" ry="13.27" fill="#fff" />
			<ellipse cx="32" cy="37.25" rx="16.03" ry="18.27" fill="#000" />
			<ellipse cx="32" cy="17.12" rx="11.04" ry="11.04" fill="#000" />
		</mask>
		<mask id="belly-edge">
			<ellipse cx="32" cy="40.24" rx="12.15" ry="15.81" fill="#fff" />
			<ellipse cx="32" cy="40.24" rx="9.92" ry="13.57" fill="#000" />
		</mask>
	</defs>

	<rect width="64" height="64" rx="14" fill="#101014" />

	<!-- Themed: the half a theme has already reached. -->
	<g clip-path="url(#themed)">
		<ellipse cx="50.41" cy="39.12" rx="3.88" ry="11.19" transform="rotate(18 50.41 39.12)" fill="#a855f7" />
		<ellipse cx="32" cy="37.25" rx="18.27" ry="20.5" fill="url(#painted)" />
		<ellipse cx="32" cy="17.12" rx="13.27" ry="13.27" fill="url(#painted)" />
		<ellipse cx="39.6" cy="57.61" rx="5.82" ry="2.54" transform="rotate(8 39.6 57.61)" fill="#f59e0b" />
		<ellipse cx="32" cy="40.24" rx="12.15" ry="15.81" fill="#f5f6fa" />
		<ellipse cx="32" cy="18.25" rx="9.55" ry="8.8" fill="#f5f6fa" />
		<path d="M28.87 19.88h6.26L32 23.84Z" fill="#f59e0b" />
		<circle cx="35.58" cy="15.64" r="2.24" fill="#121218" />
	</g>

	<!-- Bare: the same bird before it. -->
	<g clip-path="url(#bare)" fill="#f5f6fa">
		<rect width="64" height="64" mask="url(#body-edge)" />
		<rect width="64" height="64" mask="url(#belly-edge)" />
		<ellipse cx="13.59" cy="39.12" rx="3.88" ry="11.19" transform="rotate(-18 13.59 39.12)" />
		<ellipse cx="24.4" cy="57.61" rx="5.82" ry="2.54" transform="rotate(-8 24.4 57.61)" />
		<circle cx="28.42" cy="15.64" r="2.24" />
	</g>
</svg>
