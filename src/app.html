<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<title>OpenThemeGenerator</title>
		%sveltekit.head%
	</head>
	<!--
		Hovering a sidebar entry fetches that route's code before the click lands. In a desktop
		window the pointer is always on its way somewhere, so this turns most navigations into a
		swap of already-loaded modules.
	-->
	<body data-sveltekit-preload-data="hover">
		<div id="app">%sveltekit.body%</div>
	</body>
</html>
