[package]
name = "openthemegenerator"
version = "0.1.0"
description = "Generate shadcn-compatible colour themes and export them for any project that reads CSS custom properties"
authors = ["thorstenalpers"]
repository = "https://github.com/thorstenalpers/OpenThemeGenerator"
license = "MIT"
edition = "2021"

[lib]
name = "openthemegenerator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `windows-native` puts the key in the Windows Credential Manager rather than in a file this app
# would then own the protection of.
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.13", default-features = false, features = [
	"blocking",
	"json",
	"rustls",
] }
